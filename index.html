<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Presidents Street Fighter</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            padding: 0;
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #0a0a12;
            font-family: monospace;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #game-wrapper {
            position: relative;
            border: 4px solid #c9a227;
            box-shadow: 0 0 40px rgba(201, 162, 39, 0.4), inset 0 0 60px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #1a1a2e;
        }

        #controls-hint {
            color: #8899aa;
            font-size: 7px;
            text-align: center;
            line-height: 1.8;
            max-width: 520px;
        }

        #controls-hint span { color: #c9a227; }
    </style>
    <script defer src="./index.js"></script>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="game"></canvas>
    </div>
    <p id="controls-hint">
        <span>P1</span> A/D move · W jump · F punch · G kick · S block &nbsp;|&nbsp;
        <span>P2</span> ←/→ move · ↑ jump · K punch · L kick · ↓ block &nbsp;|&nbsp;
        ENTER to confirm
    </p>
</body>
</html>
